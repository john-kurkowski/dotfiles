add_newline = false
command_timeout = 2000
format = "$directory$vcs$nodejs$python$rust$swift${custom.virtualenv}$status$character"
right_format= """$cmd_duration $time"""

[aws]
disabled = true

[cmd_duration]
min_time = 30000
min_time_to_notify = 30000
show_milliseconds = true
show_notifications = true

[git_commit]
disabled = true

[gcloud]
disabled = true

[vcs]
order = ["jj", "git"]
jj_modules = "$jj_bookmark$jj_status"
git_modules = "$git_branch$git_status"

[line_break]
disabled = true

[nodejs]
format = '[$symbol($version )]($style)'

[package]
disabled = true

[python]
format = '[${symbol}${pyenv_prefix}(${version} )]($style)'

[custom.virtualenv]
command = 'exec "$HOME/.config/starship/virtualenv-indicator"'
when = true
shell = ['sh']
format = '[$output]($style) '
style = 'yellow bold'
description = 'The active Python virtual environment'

[status]
disabled = false

[time]
format = "[$time]($style)"
disabled = false
style = "dimmed"
time_format = "%F %T"
